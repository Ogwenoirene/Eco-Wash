<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | EcoWash</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://kit.fontawesome.com/0906bc9ec6.js" crossorigin="anonymous"></script>
</head>
<body class="font-sans text-gray-700">
<!--navigation-->
<header class="flex flex-wrap items-center justify-between bg-green-800 px-5 py-4">
  <a href="index.html" class="text-2xl font-bold text-white">EcoWash</a>
  <nav class="flex gap-4 text-white">
    <a href="index.html" class="hover:underline">Home</a>
    <a href="book.html" class="hover:underline">Book</a>
    <a href="orders.html" class="hover:underline"> Orders</a>
    <a href="account.html" class="hover:underline">Login</a>
  </nav>
</header>
  <main class="mx-auto max-w-md px-5 py-10">
  <div id="auth" class="rounded-lg border border-gray-300 bg-white p-6 shadow-sm">
    <h2 class="text-center text-2xl font-bold text-green-800">Customer Account</h2>
    <p class="mb-5 mt-1 text-center text-gray-500">
      Track orders,save address.
    </p>
    <div class="grid grid-cols-2">
      <input type="radio" name="auth-tab" id="tab-login" class="peer/login sr-only" checked />
      <input type="radio" name="auth-tab" id="tab-signup" class="peer/signup sr-only" />

      <!-- Tabs -->
      <label for="tab-login"
        class="cursor-pointer border-b-4 border-gray-200 py-2 text-center font-semibold text-gray-500 hover:text-green-800 peer-checked/login:border-green-600 peer-checked/login:text-green-800 peer-focus-visible/login:ring-2 peer-focus-visible/login:ring-green-300">
        Log In
      </label>
      <label for="tab-signup"
        class="cursor-pointer border-b-4 border-gray-200 py-2 text-center font-semibold text-gray-500 hover:text-green-800 peer-checked/signup:border-green-600 peer-checked/signup:text-green-800 peer-focus-visible/signup:ring-2 peer-focus-visible/signup:ring-green-300">
        Create Account
      </label>

      <!-- Login Form -->
      <form class="col-span-2 mt-4 hidden peer-checked/login:block">
        <div class="mb-4">
          <label for="login-email" class="block font-semibold">Email Address</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" required
            class="mt-1 w-full rounded-md border-2 border-gray-300 p-2 focus:border-green-600 focus:outline-none [&:not(:placeholder-shown):invalid]:border-red-500" />
        </div>
        <div class="mb-4">
          <label for="login-pass" class="block font-semibold">Password</label>
          <input type="password" id="login-pass" name="password" minlength="8" placeholder="Minimum 8 characters" required
            class="mt-1 w-full rounded-md border-2 border-gray-300 p-2 focus:border-green-600 focus:outline-none [&:not(:placeholder-shown):invalid]:border-red-500" />
        </div>
        <button type="submit"
          class="w-full rounded-md bg-green-600 py-3 text-white hover:bg-green-800">
          Log In to Dashboard
        </button>
      </form>
      <!-- Sign Up Form -->
      <form  class="col-span-2 mt-4 hidden peer-checked/signup:block">
        <div class="mb-4">
          <label for="reg-name" class="block font-semibold">Full Name</label>
          <input type="text" id="reg-name" name="name" placeholder="Jane Doe" required
            class="mt-1 w-full rounded-md border-2 border-gray-300 p-2 focus:border-green-600 focus:outline-none" />
        </div>
        <div class="mb-4">
          <label for="reg-phone" class="block font-semibold">Phone Number (for SMS updates)</label>
          <input type="tel" id="reg-phone" name="phone" placeholder="0712 345 678" required
            class="mt-1 w-full rounded-md border-2 border-gray-300 p-2 focus:border-green-600 focus:outline-none" />
        </div>
        <div class="mb-4">
          <label for="reg-email" class="block font-semibold">Email Address</label>
          <input type="email" id="reg-email" name="email" placeholder="you@example.com" required
            class="mt-1 w-full rounded-md border-2 border-gray-300 p-2 focus:border-green-600 focus:outline-none [&:not(:placeholder-shown):invalid]:border-red-500" />
        </div>
        <div class="mb-4">
          <label for="reg-pass" class="block font-semibold">Create Password</label>
          <input type="password" id="reg-pass" name="password" minlength="8" placeholder="Minimum 8 characters" required
            class="mt-1 w-full rounded-md border-2 border-gray-300 p-2 focus:border-green-600 focus:outline-none [&:not(:placeholder-shown):invalid]:border-red-500" />
        </div>
        <button type="submit"
          class="w-full rounded-md bg-green-600 py-3 text-white hover:bg-green-800">
          Create Free Account
        </button>
      </form>
    </div>
  </div>
</main>
<!--footer section-->
<footer class="bg-green-800 p-5 text-center text-white">
  <div class="mx-auto flex max-w-4xl flex-col items-center gap-8 text-center md:flex-row md:items-start md:justify-between md:text-left">
    <div aria-labelledby="visit-title">
      <h2 id="visit-title" class="mb-3 text-xl font-bold">Visit Us</h2>
      <address class="flex flex-col gap-1 not-italic">
        <span class="font-semibold">Eco Wash Laundry</span>
        <span>Mama Ngina, Kinoo</span>
        <span>Nairobi, Kenya</span>
        <a href="tel:+254719376151" class="mt-1 font-semibold hover:underline">+254 719 376 151</a>
      </address>
    </div>

    <div class="flex items-center gap-3">
      <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-xl text-green-800 hover:bg-green-100">
        <i class="fa-brands fa-whatsapp"></i>
      </span>
      <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-xl text-green-800 hover:bg-green-100">
        <i class="fa-brands fa-facebook"></i>
      </span>
      <span class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-xl text-green-800 hover:bg-green-100">
        <i class="fa-solid fa-x"></i>
      </span>
    </div>

  </div>
  <p>&copy; 2026 EcoWash. Fresh clothes, kinder to the planet.</p>
</footer>
</body>
</html>
